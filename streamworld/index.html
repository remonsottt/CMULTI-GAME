<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamWorld — Survive the network</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d0d1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #aaaacc;
        }

        #header {
            width: 900px;
            max-width: 100vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: #111122;
            border-bottom: 1px solid #223344;
        }

        #header .logo {
            font-size: 14px;
            color: #1D9E75;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #header .proto-badge {
            font-size: 10px;
            color: #556677;
        }

        #game-container {
            width: 900px;
            max-width: 100vw;
            position: relative;
            background: #1a1a2e;
            border: 1px solid #223344;
            overflow: hidden;
        }

        #game-container canvas {
            display: block;
        }

        #footer {
            width: 900px;
            max-width: 100vw;
            padding: 5px 12px;
            background: #111122;
            border-top: 1px solid #223344;
            font-size: 10px;
            color: #446688;
            display: flex;
            justify-content: space-between;
        }

        #footer a { color: #378ADD; text-decoration: none; }

        /* Loading screen */
        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            z-index: 9999;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        #loading.hidden { opacity: 0; }

        #loading h1 {
            font-size: 42px;
            color: #1D9E75;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        #loading p {
            font-size: 13px;
            color: #556699;
            margin-bottom: 24px;
        }

        #loading-bar-bg {
            width: 320px;
            height: 6px;
            background: #222244;
            border-radius: 3px;
            overflow: hidden;
        }

        #loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #1D9E75, #378ADD);
            width: 0%;
            border-radius: 3px;
            animation: loadAnim 1.2s ease-out forwards;
        }

        @keyframes loadAnim {
            0%   { width: 0%; }
            40%  { width: 60%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

<div id="header">
    <span class="logo">◀ STREAMWORLD ▶</span>
    <span class="proto-badge">HTTP/DASH · RTP/IGMP · MPEG2-TS · Educational Game</span>
</div>

<div id="game-container">
    <div id="loading">
        <h1>STREAMWORLD</h1>
        <p>Initialising network stack…</p>
        <div id="loading-bar-bg"><div id="loading-bar"></div></div>
    </div>
</div>

<div id="footer">
    <span>Zone 1: DASH Land — Adaptive Bitrate Streaming</span>
    <span>Zone 2: RTP Land — IGMP Multicast IPTV</span>
</div>

<!-- Phaser 3 from CDN -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

<!-- Game entry point (ES modules) -->
<script type="module" src="src/main.js"></script>

<script>
    // Hide loading screen once Phaser canvas appears
    const loading = document.getElementById('loading');
    const observer = new MutationObserver(() => {
        const canvas = document.querySelector('#game-container canvas');
        if (canvas) {
            setTimeout(() => {
                loading.classList.add('hidden');
                setTimeout(() => loading.remove(), 600);
            }, 400);
            observer.disconnect();
        }
    });
    observer.observe(document.getElementById('game-container'), { childList: true });
</script>

</body>
</html>
